{% extends "base.html" %}

{% block title %}
Edit Goal | Student Portal
{% endblock %}


{% block content %}

<main class="container">

    <div class="page-label">
        Study Goals
    </div>

    <h1 class="page-title">
        Edit Goal ✏️
    </h1>

    <p class="page-description">
        Update your study goal.
    </p>


    <div class="form-card">

        <form method="POST">

            <input
                type="text"
                name="title"
                value="{{ goal['title'] }}"
                required
            >

            <br><br>

            <button
                type="submit"
                class="btn"
            >
                Save Changes
            </button>

            <a
                href="{{ url_for('goals') }}"
                class="btn"
            >
                Cancel
            </a>

        </form>

    </div>

</main>

{% endblock %}
