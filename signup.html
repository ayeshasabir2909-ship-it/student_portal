{% extends "base.html" %}

{% block title %}
Create Account | Student Portal
{% endblock %}


{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <h1>
            Create Account 🚀
        </h1>

        <p>
            Create your Student Portal account.
        </p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <div class="form-group">

                <label>
                    Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="At least 6 characters"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Repeat your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn"
                style="width:100%;"
            >
                Create Account
            </button>

        </form>


        <div class="auth-footer">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
