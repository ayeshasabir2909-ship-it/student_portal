{% extends "base.html" %}

{% block title %}
Login | Student Portal
{% endblock %}


{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <h1>
            Welcome Back 👋
        </h1>

        <p>
            Login to continue to your Student Portal.
        </p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn"
                style="width:100%;"
            >
                Login
            </button>

        </form>


        <div class="auth-footer">

            Don't have an account?

            <a href="{{ url_for('signup') }}">
                Create Account
            </a>

        </div>

    </div>

</div>

{% endblock %}
